<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pair Code | VOX-MD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background: black;
    }

    /* Digital 3D Glowing Footer */
    .glowing-footer {
      font-size: 2.5rem;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: #00d9ff;
      text-shadow: 0 0 10px #00d9ff, 0 0 20px #ff00ff, 0 0 40px #ff0055, 0 0 80px #0088ff;
      animation: glowCycle 3s infinite alternate;
    }

    /* Animation for Smooth Color Change */
    @keyframes glowCycle {
      0% {
        text-shadow: 0 0 10px #00d9ff, 0 0 20px #ff00ff, 0 0 40px #ff0055, 0 0 80px #0088ff;
      }
      25% {
        text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff, 0 0 40px #ff0088, 0 0 80px #00ff88;
      }
      50% {
        text-shadow: 0 0 10px #ff0055, 0 0 20px #0088ff, 0 0 40px #00ffff, 0 0 80px #ff00ff;
      }
      75% {
        text-shadow: 0 0 10px #00ff88, 0 0 20px #ff0088, 0 0 40px #0088ff, 0 0 80px #00d9ff;
      }
      100% {
        text-shadow: 0 0 10px #0088ff, 0 0 20px #00d9ff, 0 0 40px #ff00ff, 0 0 80px #ff0055;
      }
    }

    /* Full-Screen Background GIF */
    .waves {
      position: fixed;
      width: 100%;
      height: 100%;
      background: url("https://files.catbox.moe/x1xups.gif") center center no-repeat;
      background-size: cover;
      z-index: -1;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background: url("https://i.postimg.cc/NjymQz1X/VOX-MD-BOT-LOGO.jpg") center/cover no-repeat;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 6px rgba(250, 249, 249, 0.8);
    }

    .box {
      width: 350px;
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      box-shadow: 0 0 6px rgba(250, 249, 249, 0.7);
    }

    #text {
      color: #f6f5f5;
    }

    .input-container {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 1rem;
      padding: 0.3rem;
      max-width: 300px;
      width: 100%;
    }

    .input-container input {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      outline: none;
    }

    .input-container button {
      padding: 1rem;
      background: linear-gradient(135deg, #c01736 0%, #8b17b6 100%);
      font-weight: bold;
      text-transform: uppercase;
      color: white;
      border: none;
      width: 90%;
      border-radius: 10px;
      transition: 0.3s;
      cursor: pointer;
    }

    .input-container button:hover {
      background: linear-gradient(135deg, #8b17b6 0%, #c01736 100%);
    }

    /* Modern Loading Animation */
    #waiting-message {
      display: none;
      color: white;
      font-weight: bold;
      animation: fadeIn 1s infinite alternate;
    }

    @keyframes fadeIn {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Music Control Button */
    .music-button {
      position: fixed;
      bottom: 80px;
      right: 20px;
      padding: 10px 15px;
      background: #ff00ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .music-button:hover {
      background: #c01736;
    }

    /* Mobile Responsive */
    @media (max-width: 500px) {
      .box {
        width: 90%;
      }

      .input-container {
        flex-direction: column;
      }

      .input-container input, .input-container button {
        width: 100%;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Water Waves Background -->
  <div class="waves"></div>

  <!-- Pairing Code UI -->
  <div class="container">
    <div class="box">
      <div id="text">
        <i class="fa fa-user"></i>
        <h3 class="centered-text">VOX-MD PAIRING CODE</h3>
        <h6>Made By KANAMBO TECH 🔥</h6>
        <h6>Enter Your Number with Country Code</h6>

        <div class="input-container">
          <input placeholder="254xxx" type="number" id="number">
          <button id="submit">SUBMIT</button>
        </div>

        <a id="waiting-message">♻️ KANAMBO on it... please wait!</a>
        <br><br>
        <main id="pair"></main>
      </div>
    </div>
  </div>

  <!-- Background Music -->
  <audio id="background-music" autoplay loop muted>
    <source src="https://files.catbox.moe/m68e4q.mp3" type="audio/mpeg">
  </audio>

  <!-- Music Control Button -->
  <button id="music-toggle" class="music-button">⏸ Pause Music</button>

  <script>
    let music = document.getElementById("background-music");
    let musicToggle = document.getElementById("music-toggle");

    // Ensure the music plays instantly
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        music.muted = false;
      }, 500);
    });

    musicToggle.addEventListener("click", () => {
      if (music.paused) {
        music.play();
        musicToggle.innerHTML = "⏸ Pause Music";
      } else {
        music.pause();
        musicToggle.innerHTML = "▶ Play Music";
      }
    });

</script>
  <!-- Axios Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>

<!-- CSS for Code Container -->
<style>
  #code-container {
    display: none;
    background-color: #222;
    color: white;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
    position: relative;
    width: 250px;
    margin: auto;
  }

  #copy-btn {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 10px;
  }

  #popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: black;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    font-weight: bold;
    z-index: 9999;
  }
</style>

<!-- JavaScript -->
<script>
  let pairMessage = document.getElementById("pair");
  let submitButton = document.getElementById("submit");
  let numberInput = document.getElementById("number");
  let waitingMessage = document.getElementById("waiting-message");
  let codeContainer = document.getElementById("code-container");
  let codeText = document.getElementById("code-text");
  let popup = document.getElementById("popup");

  async function Copy() {
    await navigator.clipboard.writeText(codeText.innerText);

    // Show popup message
    popup.style.display = "block";
    setTimeout(() => {
      popup.style.display = "none";
    }, 1000); // Hide popup after 1 second
  }

  submitButton.addEventListener("click", async (e) => {
    e.preventDefault();
    if (!numberInput.value) {
      pairMessage.innerHTML = '<a style="color:white;font-weight:bold">Enter your WhatsApp number with Country Code</a><br><br>';
    } else {
      waitingMessage.style.display = "block";
      try {
        let { data } = await axios.get(`/code?number=${numberInput.value}`);
        codeText.innerText = data.code || "Service Unavailable";
        codeContainer.style.display = "block";
      } catch (error) {
        pairMessage.innerHTML = '<a style="color:red;font-weight:bold">Error fetching code. Try again!</a><br><br>';
      } finally {
        waitingMessage.style.display = "none";
      }
    }
  });
</script>

<!-- Code Container -->
<div id="code-container">
  <span id="code-text">123456</span>
  <br>
  <button id="copy-btn" onclick="Copy()">Copy</button>
</div>

<!-- Popup for Copy Confirmation -->
<div id="popup">Code Copied!</div>

  <!-- 3D Glowing Footer -->
  <h1 class="glowing-footer">VOX-MD</h1>

</body>
</html>
