<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pair Code | VOX-MD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background: black;
    }

    /* Full-Screen Background GIF */
.waves {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("https://files.catbox.moe/igptnq.gif") center center no-repeat;
  background-size: cover;
  z-index: -1;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background: url("https://i.postimg.cc/NjymQz1X/VOX-MD-BOT-LOGO.jpg") center/cover no-repeat;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(250, 249, 249, 0.8);
      backdrop-filter: blur(5px);
    }

    .box {
      width: 350px;
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(250, 249, 249, 0.7);
    }

    #text {
      color: #f6f5f5;
    }

    .input-container {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 1rem;
      padding: 0.3rem;
      max-width: 300px;
      width: 100%;
    }

    .input-container input {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      outline: none;
      backdrop-filter: blur(10px);
    }

    .input-container button {
      padding: 1rem;
      background: linear-gradient(135deg, #c01736 0%, #8b17b6 100%);
      font-weight: bold;
      text-transform: uppercase;
      color: white;
      border: none;
      width: 90%;
      border-radius: 10px;
      transition: 0.3s;
      cursor: pointer;
    }

    .input-container button:hover {
      background: linear-gradient(135deg, #8b17b6 0%, #c01736 100%);
    }

    /* Modern Loading Animation */
    #waiting-message {
      display: none;
      color: white;
      font-weight: bold;
      animation: fadeIn 1s infinite alternate;
    }

    @keyframes fadeIn {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Mobile Responsive */
    @media (max-width: 500px) {
      .box {
        width: 90%;
      }

      .input-container {
        flex-direction: column;
      }

      .input-container input, .input-container button {
        width: 100%;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Water Waves Background -->
  <div class="waves"></div>

  <!-- Pairing Code UI -->
  <div class="container">
    <div class="box">
      <div id="text">
        <i class="fa fa-user"></i>
        <h3 class="centered-text">KANAMBO PAIRING CODE</h3>
        <h6>Made By KANAMBO TECH 🔥</h6>
        <h6>Enter Your Number with Country Code</h6>
        
        <div class="input-container">
          <input placeholder="254xxxx" type="number" id="number">
          <button id="submit">REQUEST CODE</button>
        </div>
        
        <a id="waiting-message">🌊 KANAMBO on it... please wait!</a>
        <br><br>
        <main id="pair"></main>
      </div>
    </div>
  </div>

  <!-- Background Wave Sound -->
  <audio autoplay loop>
    <source src="https://www.fesliyanstudios.com/play-mp3/4384" type="audio/mpeg">
  </audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let pairMessage = document.getElementById("pair");
    let submitButton = document.getElementById("submit");
    let numberInput = document.getElementById("number");
    let waitingMessage = document.getElementById("waiting-message");

    async function Copy() {
      let text = document.getElementById("copy").innerText;
      let obj = document.getElementById("copy");
      await navigator.clipboard.writeText(obj.innerText.replace('CODE: ', ''));
      obj.innerText = "COPIED";
      obj.style = "color:blue;font-weight:bold";
      setTimeout(() => {
        obj.innerText = text;
        obj.style = "color:white;font-weight-bold";
      }, 500);
    }

    submitButton.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!numberInput.value) {
        pairMessage.innerHTML = '<a style="color:white;font-weight:bold">Enter your WhatsApp number with Country Code</a><br><br>';
      } else if (numberInput.value.replace(/[^0-9]/g, "").length < 11) {
        pairMessage.innerHTML = '<a style="color:red;font-weight:bold">Invalid Number</a><br><br>';
      } else {
        waitingMessage.style.display = "block"; // Show waiting message
        numberInput.disabled = true;
        submitButton.disabled = true;

        let formattedNumber = numberInput.value.replace(/[^0-9]/g, "");
        numberInput.type = "text";
        numberInput.value = "+" + formattedNumber;
        numberInput.style = "color:black;font-size:20px";

        let { data } = await axios(`/code?number=${formattedNumber}`);
        let code = data.code || "Service Unavailable";
        
        waitingMessage.style.display = "none"; // Hide waiting message
        numberInput.disabled = false;
        submitButton.disabled = false;

        pairMessage.innerHTML = `<font id="copy" onclick="Copy()" style="color:red;font-weight:bold">CODE: <span style="color:white;font-weight:bold">${code}</span></font><br><br>`;
      }
    });
  </script>

</body>
</html>
