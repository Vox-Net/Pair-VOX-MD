<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOXNET.Inc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Cyberpunk Engine Background */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
      background: url('https://cdn69.savetube.su/media/gmdbpJ_HLjQ/speed-movement-futuristic-esports-neon-green-arrows-background-video-footage-screensaver-720-ytshorts.savetube.me.mp4') no-repeat center center;
      background-size: cover;
      animation: moveBackground 10s infinite linear;
    }

    @keyframes moveBackground {
      0% { background-position: 0% 0%; }
      50% { background-position: 50% 50%; }
      100% { background-position: 100% 100%; }
    }

    /* Digital Clock */
    .clock {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      background: linear-gradient(90deg, #ff00ff, #ff6600);
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
    }

    /* Battery Status */
    .battery-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 16px;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      width: 150px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .charging { background: #00ff00; color: black; }
    .low-battery { background: #ff0000; color: white; }
    .normal { background: #007bff; color: white; }

    /* Welcome Container */
    .welcome-container {
      max-width: 90%;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
    }

    .welcome-message {
      font-size: 18px;
      font-weight: bold;
      color: #00eaff;
      white-space: pre-wrap;
      overflow: hidden;
    }

    /* Main Container */
    .container {
      background: rgba(0, 255, 0, 0.15);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
      max-width: 420px;
      text-align: center;
      display: none;
    }

    /* Button Grid */
    .button-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      justify-content: center;
    }

    .btn {
      width: 180px;
      padding: 14px;
      background: linear-gradient(90deg, #00eaff, #007bff);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
    }

    .btn:hover {
      background: linear-gradient(90deg, #007bff, #00eaff);
      transform: scale(1.05);
    }

    /* Footer */
    .footer {
      margin-top: 10px;
      font-size: 16px;
    }

    /* IP Address */
    .ip-address {
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      color: #00ffcc;
    }

    /* Device Type */
    .device-type {
      font-size: 16px;
      margin-top: 10px;
    }

    /* Kenyan Flag Animation */
    .kenya {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 10px;
      animation: fadeIn 2s infinite alternate;
    }

    @keyframes fadeIn {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Digital Clock -->
  <button id="clock" class="clock">Loading Time...</button>

  <!-- Battery Status -->
  <button id="battery-status" class="battery-btn normal">Checking Battery...</button>

  <!-- Welcome Message -->
  <div class="welcome-container">
    <p class="welcome-message">Welcome to VOXNET.Inc!  
    We are here to serve you.  
    Feel at home under the courtesy of MR. PETER KANAMBO.</p>
    <button class="btn" onclick="showMainMenu()">Continue</button>
  </div>

  <!-- Main Content -->
  <div class="container">
    <h2>Welcome to <span style="color:#00eaff;">VOXNET.Inc</span></h2>
    <p>Your Smart Digital Hub</p>

    <!-- Buttons -->
    <div class="button-container">
      <button onclick="window.open('/pair')" class="btn">Pair Code</button>
      <button onclick="window.open('/qr')" class="btn">Scan QR Code</button>
      <button onclick="window.open('https://github.com/Vox-Net/VOX-MD')" class="btn">Bot Repo</button>
      <button onclick="window.open('https://wa.me/254114148625')" class="btn">Contact Kanambo</button>
    </div>

    <!-- IP Address & Device Type -->
    <p id="ip-address" class="ip-address">Fetching IP...</p>
    <p id="device-type" class="device-type">Detecting Device...</p>

    <!-- Footer -->
    <div class="kenya">
      🇰🇪 A Product of Kenya 🇰🇪
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    function showMainMenu() {
      document.querySelector(".welcome-container").style.display = "none";
      document.querySelector(".container").style.display = "block";
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchIP() {
      const response = await fetch("https://api64.ipify.org?format=json");
      const data = await response.json();
      document.getElementById("ip-address").innerText = `Your IP: ${data.ip}`;
    }
    fetchIP();

    const userAgent = navigator.userAgent.toLowerCase();
    const device = /mobile|android|tablet/i.test(userAgent) ? "Mobile/Tablet" : "Desktop";
    document.getElementById("device-type").innerText = `Device: ${device}`;
  </script>

</body>
</html>
