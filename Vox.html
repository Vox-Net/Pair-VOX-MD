<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOXNET.Inc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Cyberpunk Neon Background */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    /* Glowing Green Container */
    .container {
      background: rgba(0, 255, 0, 0.15);
      padding: 25px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Modern Stylish Buttons */
    .btn {
      width: 260px;
      padding: 14px;
      background: linear-gradient(90deg, #00eaff, #007bff);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.4s;
      margin: 12px;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      background: linear-gradient(90deg, #007bff, #00eaff);
      box-shadow: 0 10px 20px rgba(0, 255, 255, 0.8);
      transform: scale(1.05);
    }

    /* User Info Styling */
    .user-info {
      margin-top: 20px;
      font-size: 16px;
      color: #ddd;
    }

    /* Battery Status Button */
    .battery-btn {
      width: 220px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .battery-btn.normal {
      background: #32CD32;
      box-shadow: 0 0 12px #32CD32;
    }

    .battery-btn.low {
      background: #FF4500;
      box-shadow: 0 0 12px #FF4500;
    }

    .battery-btn.charging {
      background: #008CFF;
      box-shadow: 0 0 12px #008CFF;
    }

    /* Digital Clock */
    .clock {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      padding: 12px;
      width: 200px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      background: linear-gradient(90deg, #ff00ff, #ff6600);
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
      transition: 0.4s;
    }

    .clock:hover {
      transform: scale(1.1);
    }

  </style>
</head>
<body>

  <!-- Cyberpunk Glowing Container -->
  <div class="container">
    <h2>Welcome to <span style="color:#00eaff;">VOXNET.Inc</span></h2>
    <p>Your Smart Digital Hub</p>

    <!-- User Information -->
    <div class="user-info">
      <p><strong>IP Address:</strong> <span id="ipAddress">Loading...</span></p>
      <p><strong>Device:</strong> <span id="deviceModel">Detecting...</span></p>
      <p><strong>Type:</strong> <span id="deviceType">Checking...</span></p>
    </div>

    <!-- Battery Info -->
    <button id="batteryBtn" class="battery-btn normal">Battery: Checking...</button>

    <!-- Stylish Buttons -->
    <button onclick="window.open('/pair')" class="btn">Pair Code</button>
    <button onclick="window.open('/qr')" class="btn">Scan QR Code</button>
    <button onclick="window.open('https://github.com/Vox-Net/VOX-MD')" class="btn">Bot Repo</button>
    <button onclick="window.open('https://github.com/Kanambp/KANAMBO-QR')" class="btn">QR Code Repo</button>
    <button onclick="window.open('https://wa.me/254114148625')" class="btn">Contact Kanambo</button>
    <button onclick="window.open('https://chat.whatsapp.com/Byx7wdqizJXB79RKFKsefb')" class="btn">Join Group</button>

    <!-- Digital Clock -->
    <button id="clock" class="clock">Loading Time...</button>
  </div>

  <!-- JavaScript for Device, Battery, and Time -->
  <script>
    // Fetch User's IP Address
    fetch('https://api64.ipify.org?format=json')
      .then(response => response.json())
      .then(data => document.getElementById('ipAddress').innerText = data.ip)
      .catch(() => document.getElementById('ipAddress').innerText = "Unavailable");

    // Detect Device Model & Type
    function getDeviceInfo() {
      const userAgent = navigator.userAgent;
      let device = "Unknown Device";
      let type = "Unknown";
      let brand = "Unknown Brand";

      let brands = ["Samsung", "Infinix", "Tecno", "Huawei", "Xiaomi", "OnePlus", "Oppo", "Vivo", "Realme", "Nokia"];
      let foundBrand = brands.find(b => userAgent.includes(b)) || "Android Device";

      if (/iPhone/i.test(userAgent)) {
        device = "iPhone";
        type = "Phone";
      } else if (/iPad/i.test(userAgent)) {
        device = "iPad";
        type = "Tablet";
      } else if (/Android/i.test(userAgent)) {
        device = foundBrand;
        type = "Phone";
      } else if (/Windows/i.test(userAgent) || /Macintosh/i.test(userAgent) || /Linux/i.test(userAgent)) {
        device = /Windows/i.test(userAgent) ? "Windows PC" : (/Macintosh/i.test(userAgent) ? "MacBook" : "Linux Machine");
        type = "Desktop";
      }

      document.getElementById('deviceModel').innerText = device;
      document.getElementById('deviceType').innerText = type;

      // Pop-up for detected brand
      alert("Device Type: " + type + "\nBrand: " + device);
    }
    getDeviceInfo();

    // Battery Status
    navigator.getBattery().then(battery => {
      function updateBatteryStatus() {
        const batteryBtn = document.getElementById('batteryBtn');
        let batteryLevel = Math.round(battery.level * 100) + "%";
        let chargingStatus = battery.charging ? "⚡ Charging" : "🔋 Not Charging";

        batteryBtn.innerText = `Battery: ${batteryLevel} | ${chargingStatus}`;

        batteryBtn.classList.toggle("charging", battery.charging);
        batteryBtn.classList.toggle("low", battery.level < 0.2 && !battery.charging);
        batteryBtn.classList.toggle("normal", battery.level >= 0.2 && !battery.charging);
      }
      updateBatteryStatus();
      battery.addEventListener('levelchange', updateBatteryStatus);
      battery.addEventListener('chargingchange', updateBatteryStatus);
    });

    // Digital Clock
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Africa/Nairobi', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('clock').innerText = new Intl.DateTimeFormat('en-US', options).format(now);
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
