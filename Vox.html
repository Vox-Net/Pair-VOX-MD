<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOXNET.Inc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Cyberpunk Neon Background */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    /* Typing Effect */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .welcome-container {
      max-width: 90%;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
    }

    .welcome-message {
      font-size: 18px;
      font-weight: bold;
      color: #00eaff;
      display: inline-block;
      white-space: pre-wrap; /* Allows line breaks */
      overflow: hidden;
      border-right: 3px solid #00eaff;
      animation: typing 3s steps(40, end), blink 0.75s step-end infinite;
    }

    .continue-btn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #00eaff, #007bff);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
      display: none;
    }

    /* Glowing Container */
    .container {
      background: rgba(0, 255, 0, 0.15);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
      max-width: 420px;
      text-align: center;
      display: none;
    }

    /* Modern Buttons */
    .btn {
      width: 260px;
      padding: 14px;
      background: linear-gradient(90deg, #00eaff, #007bff);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s;
      margin: 10px;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
    }

    .btn:hover {
      background: linear-gradient(90deg, #007bff, #00eaff);
      transform: scale(1.05);
    }

    /* Digital Clock */
    .clock {
      font-size: 20px;
      font-weight: bold;
      padding: 12px;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff00ff, #ff6600);
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
    }

    /* Battery Status Button */
    .battery-btn {
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
      border-radius: 10px;
      width: 240px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Charging (Green), Low Battery (Red), Normal (Blue) */
    .charging { background: #00ff00; color: black; }
    .low-battery { background: #ff0000; color: white; }
    .normal { background: #007bff; color: white; }
  </style>
</head>
<body>

  <!-- Welcome Message -->
  <div class="welcome-container">
    <p class="welcome-message" id="welcome-text"></p>
    <button class="continue-btn" onclick="showMainMenu()">Continue</button>
  </div>

  <!-- Main Content -->
  <div class="container">
    <h2>Welcome to <span style="color:#00eaff;">VOXNET.Inc</span></h2>
    <p>Your Smart Digital Hub</p>

    <!-- Buttons -->
    <button onclick="window.open('/pair')" class="btn">Pair Code</button>
    <button onclick="window.open('/qr')" class="btn">Scan QR Code</button>
    <button onclick="window.open('https://github.com/Vox-Net/VOX-MD')" class="btn">Bot Repo</button>
    <button onclick="window.open('https://github.com/Kanambp/KANAMBO-QR')" class="btn">QR Code Repo</button>
    <button onclick="window.open('https://wa.me/254114148625')" class="btn">Contact Kanambo</button>
    <button onclick="window.open('https://chat.whatsapp.com/Byx7wdqizJXB79RKFKsefb')" class="btn">Join Group</button>

    <!-- Digital Clock -->
    <button id="clock" class="clock">Loading Time...</button>

    <!-- Battery Status & IP Address -->
    <button id="battery-status" class="battery-btn normal">Checking Battery...</button>
  </div>

  <!-- JavaScript -->
  <script>
    // Typing effect
    const welcomeText = `Welcome to VOXNET.Inc! 
    We are here to serve you. 
    Feel at home under the courtesy of MR. PETER KANAMBO.`;

    let i = 0;
    function typeWriter() {
      if (i < welcomeText.length) {
        document.getElementById("welcome-text").innerHTML += welcomeText.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
      } else {
        document.querySelector(".continue-btn").style.display = "block";
      }
    }
    typeWriter();

    // Show Main Menu
    function showMainMenu() {
      document.querySelector(".welcome-container").style.display = "none";
      document.querySelector(".container").style.display = "block";
    }

    // Digital Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Battery Status
    function getBatteryInfo() {
      navigator.getBattery().then(battery => {
        function updateBattery() {
          const level = Math.round(battery.level * 100);
          let statusText = `🔋 ${level}%`;
          let statusClass = "normal";

          if (battery.charging) {
            statusText += " (Charging ⚡)";
            statusClass = "charging";
          } else if (level <= 20) {
            statusText += " (Low Battery ⚠️)";
            statusClass = "low-battery";
          }

          document.getElementById("battery-status").innerText = statusText;
          document.getElementById("battery-status").className = `battery-btn ${statusClass}`;
        }
        updateBattery();
        battery.addEventListener("levelchange", updateBattery);
        battery.addEventListener("chargingchange", updateBattery);
      });
    }
    getBatteryInfo();
  </script>

</body>
</html>
