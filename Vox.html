<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOXNET.Inc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Reset Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Fullscreen Background Video */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Body Styles */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      position: relative;
    }

    /* Top-left Clock */
    .clock {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 18px;
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, #ff00ff, #ff6600);
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
    }

    /* Top-right Battery Status */
    .battery-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 16px;
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .charging { background: #00ff00; color: black; }
    .low-battery { background: #ff0000; color: white; }
    .normal { background: #007bff; color: white; }

    /* IP, Country, and Region Container */
    .info-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 60px;
      gap: 5px;
    }

    /* Info Buttons */
    .info-btn {
      background: linear-gradient(90deg, #00eaff, #007bff);
      color: white;
      font-size: 14px;
      font-weight: bold;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 255, 255, 0.5);
      border: none;
      width: 80%;
    }

    /* Content Container */
    .container {
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
      max-width: 420px;
      text-align: center;
      margin-top: 20px;
    }

    /* Button Grid */
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #00eaff, #007bff);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 10px rgba(0, 255, 255, 0.5);
    }

    .btn:hover {
      background: linear-gradient(90deg, #007bff, #00eaff);
      transform: scale(1.05);
    }

    /* Kenyan Flag Animation */
    .kenya {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      animation: pulse 1.5s infinite alternate;
    }

    .kenya img {
      width: 30px;
      margin-left: 5px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video class="video-bg" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/uxe661.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Clock (Top-left) -->
  <button id="clock" class="clock">Loading Time...</button>

  <!-- Battery Status (Top-right) -->
  <button id="battery-status" class="battery-btn normal">Checking Battery...</button>

  <!-- IP Address, Country, and Region Name -->
  <div class="info-container">
    <button id="ip-btn" class="info-btn">Fetching IP Address...</button>
    <button id="country-btn" class="info-btn">Fetching Country...</button>
    <button id="region-btn" class="info-btn">Fetching Region...</button>
  </div>

  <!-- Main Content -->
  <div class="container">
    <h2>Welcome to <span style="color:#00eaff;">VOXNET.Inc</span></h2>
    <p>Your Smart VOX-MD Hub</p>

    <!-- Button Grid -->
    <div class="button-grid">
      <button onclick="window.open('/pair')" class="btn">Pair Code</button>
      <button onclick="window.open('/qr')" class="btn">Scan QR Code</button>
      <button onclick="window.open('https://github.com/Vox-Net/VOX-MD')" class="btn">Bot Repo</button>
      <button onclick="window.open('https://github.com/Kanambp/KANAMBO-QR')" class="btn">QR Code Repo</button>
      <button onclick="window.open('https://wa.me/254114148625')" class="btn">Contact Kanambo</button>
      <button onclick="window.open('https://chat.whatsapp.com/EZaBQvil8qT9JrI2aa1MAE')" class="btn">Join Group</button>
    </div>

    <!-- Kenyan Flag Animation -->
    <div class="kenya">
      A product of Kenya <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Flag_of_Kenya.svg/2560px-Flag_of_Kenya.svg.png" alt="Kenyan Flag">
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // Update Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: true });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Battery Status
    function getBatteryInfo() {
      navigator.getBattery().then(battery => {
        function updateBattery() {
          const level = Math.round(battery.level * 100);
          let statusText = `🔋 ${level}%`;
          let statusClass = "normal";

          if (battery.charging) {
            statusText += " (Charging ⚡)";
            statusClass = "charging";
          } else if (level <= 20) {
            statusText += " (Low Battery ⚠️)";
            statusClass = "low-battery";
          }

          document.getElementById("battery-status").innerText = statusText;
          document.getElementById("battery-status").className = `battery-btn ${statusClass}`;
        }
        updateBattery();
      });
    }
    getBatteryInfo();

    // Fetch IP, Country, and Region
    fetch('https://ip-api.com/json/')
      .then(response => response.json())
      .then(data => {
        document.getElementById('ip-btn').innerText = `IP Address: ${data.query}`;
        document.getElementById('country-btn').innerText = `Country: ${data.country}`;
        document.getElementById('region-btn').innerText = `Region: ${data.regionName}`;
      });
  </script>

</body>
</html>
