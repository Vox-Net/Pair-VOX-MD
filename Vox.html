<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOXNET.Inc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Cyberpunk Neon Background */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    /* Welcome Message */
    .welcome-message {
      font-size: 20px;
      font-weight: bold;
      color: #00eaff;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
      animation: fadeOut 4s ease-in-out forwards;
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* Glowing Green Container */
    .container {
      background: rgba(0, 255, 0, 0.15);
      padding: 25px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 10;
      display: none; /* Initially hidden */
    }

    /* Modern Stylish Buttons */
    .btn {
      width: 260px;
      padding: 14px;
      background: linear-gradient(90deg, #00eaff, #007bff);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.4s;
      margin: 12px;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      background: linear-gradient(90deg, #007bff, #00eaff);
      box-shadow: 0 10px 20px rgba(0, 255, 255, 0.8);
      transform: scale(1.05);
    }

    /* Digital Clock */
    .clock {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      padding: 12px;
      width: 200px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      background: linear-gradient(90deg, #ff00ff, #ff6600);
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
      transition: 0.4s;
    }

    .clock:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Welcome Message -->
  <div class="welcome-message">
    Welcome to VOXNET.Inc! We are here to serve you. Feel at home under the courtesy of <strong>MR. PETER KANAMBO</strong>.
  </div>

  <!-- Cyberpunk Glowing Container -->
  <div class="container">
    <h2>Welcome to <span style="color:#00eaff;">VOXNET.Inc</span></h2>
    <p>Your Smart Digital Hub</p>

    <!-- Stylish Buttons -->
    <button onclick="window.open('/pair')" class="btn">Pair Code</button>
    <button onclick="window.open('/qr')" class="btn">Scan QR Code</button>
    <button onclick="window.open('https://github.com/Vox-Net/VOX-MD')" class="btn">Bot Repo</button>
    <button onclick="window.open('https://github.com/Kanambp/KANAMBO-QR')" class="btn">QR Code Repo</button>
    <button onclick="window.open('https://wa.me/254114148625')" class="btn">Contact Kanambo</button>
    <button onclick="window.open('https://chat.whatsapp.com/Byx7wdqizJXB79RKFKsefb')" class="btn">Join Group</button>

    <!-- Digital Clock -->
    <button id="clock" class="clock">Loading Time...</button>
  </div>

  <!-- JavaScript -->
  <script>
    // Show main container after welcome message disappears
    setTimeout(() => {
      document.querySelector('.container').style.display = 'block';
    }, 4000); // 4 seconds delay

    // Digital Clock
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Africa/Nairobi', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('clock').innerText = new Intl.DateTimeFormat('en-US', options).format(now);
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
