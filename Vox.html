<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOXNET.Inc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    /* Background Animation */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1e1e2f, #252545, #2d2d5b);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Background */
    body::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 123, 255, 0.3), transparent 50%);
      animation: pulse 6s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: rotate(0deg) scale(1); opacity: 0.6; }
      100% { transform: rotate(360deg) scale(1.2); opacity: 0.3; }
    }

    /* Glassmorphic Container */
    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
      max-width: 400px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Modern Neon Buttons */
    .btn {
      width: 260px;
      padding: 14px;
      background: linear-gradient(90deg, #007bff, #0056b3);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s ease-in-out;
      margin: 12px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: 0.4s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      background: linear-gradient(90deg, #0056b3, #007bff);
      box-shadow: 0 8px 20px rgba(0, 123, 255, 0.6);
    }

    /* User Info Styling */
    .user-info {
      margin-top: 20px;
      font-size: 16px;
      color: #ddd;
    }

    /* Battery Status */
    #batteryStatus {
      font-weight: bold;
      color: #4CAF50;
    }

  </style>
</head>
<body>

  <!-- Glassmorphic Info Box -->
  <div class="container">
    <h2>Welcome to <span style="color:#007bff;">VOXNET.Inc</span></h2>
    <p>Your Smart Digital Hub</p>

    <!-- User Information -->
    <div class="user-info">
      <p><strong>IP Address:</strong> <span id="ipAddress">Loading...</span></p>
      <p><strong>Device:</strong> <span id="deviceModel">Detecting...</span></p>
      <p><strong>Battery:</strong> <span id="batteryLevel">Checking...</span></p>
      <p><strong>Charging:</strong> <span id="batteryStatus">Detecting...</span></p>
    </div>

    <!-- Modern Buttons -->
    <button onclick="window.open('/pair')" class="btn">Pair Code</button>
    <button onclick="window.open('/qr')" class="btn">Scan QR Code</button>
    <button onclick="window.open('https://github.com/Vox-Net/VOX-MD')" class="btn">Bot Repo</button>
    <button onclick="window.open('https://github.com/Kanambp/KANAMBO-QR')" class="btn">QR Code Repo</button>
    <button onclick="window.open('https://wa.me/254114148625')" class="btn">Contact Kanambo</button>
    <button onclick="window.open('https://chat.whatsapp.com/Byx7wdqizJXB79RKFKsefb')" class="btn">Join Group</button>
  </div>

  <!-- JavaScript to Fetch User IP, Device Model, and Battery Info -->
  <script>
    // Fetch User's IP Address
    fetch('https://api64.ipify.org?format=json')
      .then(response => response.json())
      .then(data => document.getElementById('ipAddress').innerText = data.ip)
      .catch(() => document.getElementById('ipAddress').innerText = "Unavailable");

    // Detect Device Model
    function getDeviceInfo() {
      const userAgent = navigator.userAgent;
      let device = "Unknown Device";

      if (/iPhone/i.test(userAgent)) device = "iPhone";
      else if (/iPad/i.test(userAgent)) device = "iPad";
      else if (/Android/i.test(userAgent)) device = "Android Device";
      else if (/Windows/i.test(userAgent)) device = "Windows PC";
      else if (/Macintosh/i.test(userAgent)) device = "MacBook";
      else if (/Linux/i.test(userAgent)) device = "Linux Machine";

      document.getElementById('deviceModel').innerText = device;
    }
    getDeviceInfo();

    // Get Battery Percentage and Charging Status
    navigator.getBattery().then(battery => {
      function updateBatteryStatus() {
        document.getElementById('batteryLevel').innerText = Math.round(battery.level * 100) + "%";
        document.getElementById('batteryStatus').innerText = battery.charging ? "Charging ⚡" : "Not Charging 🔋";
      }
      updateBatteryStatus();
      battery.addEventListener('levelchange', updateBatteryStatus);
      battery.addEventListener('chargingchange', updateBatteryStatus);
    }).catch(() => {
      document.getElementById('batteryLevel').innerText = "Unavailable";
      document.getElementById('batteryStatus').innerText = "Unavailable";
    });

  </script>

</body>
</html>
