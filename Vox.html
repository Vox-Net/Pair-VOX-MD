<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOXNET.Inc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Cyberpunk Neon Background */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    /* Typing Effect */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    /* Welcome Message */
    .welcome-container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
    }

    .welcome-message {
      font-size: 20px;
      font-weight: bold;
      color: #00eaff;
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #00eaff;
      animation: typing 3s steps(40, end), blink 0.75s step-end infinite;
    }

    .continue-btn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #00eaff, #007bff);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
      display: none;
    }

    .continue-btn:hover {
      background: linear-gradient(90deg, #007bff, #00eaff);
      transform: scale(1.05);
    }

    /* Glowing Green Container */
    .container {
      background: rgba(0, 255, 0, 0.15);
      padding: 25px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 10;
      display: none;
    }

    /* Modern Stylish Buttons */
    .btn {
      width: 260px;
      padding: 14px;
      background: linear-gradient(90deg, #00eaff, #007bff);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.4s;
      margin: 12px;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      background: linear-gradient(90deg, #007bff, #00eaff);
      transform: scale(1.05);
    }

    /* Digital Clock */
    .clock {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      padding: 12px;
      width: 220px;
      border-radius: 10px;
      text-align: center;
      background: linear-gradient(90deg, #ff00ff, #ff6600);
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
    }

    /* Device Info */
    .device-info {
      margin-top: 15px;
      font-size: 16px;
      color: #00eaff;
    }
  </style>
</head>
<body>

  <!-- Welcome Message -->
  <div class="welcome-container">
    <p class="welcome-message" id="welcome-text"></p>
    <button class="continue-btn" onclick="showMainMenu()">Continue</button>
  </div>

  <!-- Cyberpunk Glowing Container -->
  <div class="container">
    <h2>Welcome to <span style="color:#00eaff;">VOXNET.Inc</span></h2>
    <p>Your Smart Digital Hub</p>

    <!-- Stylish Buttons -->
    <button onclick="window.open('/pair')" class="btn">Pair Code</button>
    <button onclick="window.open('/qr')" class="btn">Scan QR Code</button>
    <button onclick="window.open('https://github.com/Vox-Net/VOX-MD')" class="btn">Bot Repo</button>
    <button onclick="window.open('https://github.com/Kanambp/KANAMBO-QR')" class="btn">QR Code Repo</button>
    <button onclick="window.open('https://wa.me/254114148625')" class="btn">Contact Kanambo</button>
    <button onclick="window.open('https://chat.whatsapp.com/Byx7wdqizJXB79RKFKsefb')" class="btn">Join Group</button>

    <!-- Digital Clock -->
    <button id="clock" class="clock">Loading Time...</button>

    <!-- Device Info -->
    <div class="device-info" id="device-info">Detecting Device Info...</div>
  </div>

  <!-- JavaScript -->
  <script>
    // Typing effect for welcome message
    const welcomeText = "Welcome to VOXNET.Inc! We are here to serve you. Feel at home under the courtesy of MR. PETER KANAMBO.";
    let i = 0;
    function typeWriter() {
      if (i < welcomeText.length) {
        document.getElementById("welcome-text").innerHTML += welcomeText.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
      } else {
        document.querySelector(".continue-btn").style.display = "block";
      }
    }
    typeWriter();

    // Show main menu after clicking continue
    function showMainMenu() {
      document.querySelector(".welcome-container").style.display = "none";
      document.querySelector(".container").style.display = "block";
    }

    // Digital Clock
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Africa/Nairobi', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('clock').innerText = new Intl.DateTimeFormat('en-US', options).format(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Device Info
    function getDeviceInfo() {
      let deviceInfo = "Unknown Device";
      const userAgent = navigator.userAgent.toLowerCase();

      if (/android/.test(userAgent)) deviceInfo = "Android Device";
      else if (/iphone|ipad|ipod/.test(userAgent)) deviceInfo = "iOS Device";
      else if (/windows/.test(userAgent)) deviceInfo = "Windows PC";
      else if (/mac/.test(userAgent)) deviceInfo = "Mac PC";

      navigator.getBattery().then(battery => {
        document.getElementById("device-info").innerHTML = `
          📱 Device: ${deviceInfo} <br>
          ⚡ Charging: ${battery.charging ? "Yes" : "No"} <br>
          🔋 Battery Level: ${(battery.level * 100).toFixed(0)}% <br>
        `;
      });

      fetch("https://api.ipify.org?format=json")
        .then(response => response.json())
        .then(data => document.getElementById("device-info").innerHTML += `🌍 IP Address: ${data.ip}`);
    }
    getDeviceInfo();
  </script>

</body>
</html>
